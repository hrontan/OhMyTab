name: CI
'on':
  push: null
  pull_request: null
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  verify:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        node:
          - 22.18.0
          - 24.x
          - 26.x
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck source and tests
        run: pnpm run typecheck
      - name: Lint without modifying files
        run: pnpm run lint
      - name: Verify lint migration contracts
        run: pnpm run test:lint
      - name: Test Chrome and Firefox modes
        run: pnpm test
      - name: Test build and clean commands
        run: pnpm run test:build
      - name: Test ZIP generation
        run: pnpm run test:zip
      - name: Build Chrome and Firefox
        run: pnpm run build
      - name: Initialize standalone distribution modules
        run: node --experimental-vm-modules scripts/checks/check-bundles.ts
      - name: Package Chrome and Firefox
        run: pnpm run zip
      - name: Inspect actual distribution archives
        run: python scripts/checks/check-distribution.py
