name: Release
'on':
  push:
    tags:
      - 'v*'
# Only the publish job can write; dependency installation and builds run read-only.
permissions:
  contents: read
jobs:
  build:
    name: Build and verify ${{ github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          package-manager-cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - name: Check that the tag matches the package and manifest versions
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          base="${version%%-*}"
          for file in package.json public/chrome.json public/firefox.json; do
            actual="$(node -p "require('./$file').version")"
            if [ "$actual" != "$base" ]; then
              echo "::error::$file version $actual does not match tag $TAG"
              exit 1
            fi
          done
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck source and tests
        run: pnpm run typecheck
      - name: Lint without modifying files
        run: pnpm run lint
      - name: Test Chrome and Firefox modes
        run: pnpm test
      - name: Verify lint migration contracts
        run: pnpm run test:lint
      - name: Test build and clean commands
        run: pnpm run test:build
      - name: Test ZIP generation
        run: pnpm run test:zip
      - name: Build Chrome and Firefox
        run: pnpm run build
      - name: Initialize standalone distribution modules
        run: node --experimental-vm-modules scripts/checks/check-bundles.ts
      - name: Package Chrome and Firefox
        run: pnpm run zip
      - name: Inspect actual distribution archives
        run: python scripts/checks/check-distribution.py
      - name: Keep the verified archives for publishing
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-archives
          path: |
            dist/chrome.zip
            dist/firefox.zip
          if-no-files-found: error
          retention-days: 1
  publish:
    name: Publish ${{ github.ref_name }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Fetch the verified archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-archives
          path: dist
      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cp dist/chrome.zip "ohmytab-$TAG-chrome.zip"
          cp dist/firefox.zip "ohmytab-$TAG-firefox.zip"
          # A replaced tag keeps its release notes; only the archives are rebuilt.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" "ohmytab-$TAG-chrome.zip" "ohmytab-$TAG-firefox.zip" --repo "$GITHUB_REPOSITORY" --clobber
            exit 0
          fi
          prerelease=()
          case "$TAG" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$TAG" "ohmytab-$TAG-chrome.zip" "ohmytab-$TAG-firefox.zip" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "OhMyTab $TAG" --generate-notes "${prerelease[@]}"
