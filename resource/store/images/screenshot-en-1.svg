<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" xml:lang="en">
<defs><symbol id="logo" viewBox="0 0 128 128"><!-- Paths from resource/icon.ai PDF content; PDF coordinates reflected into SVG. -->
