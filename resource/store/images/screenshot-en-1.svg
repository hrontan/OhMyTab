<g id="background" aria-label="Background" >
<rect x="0" y="0" width="1280" height="800" rx="0" fill="#f7f6f3" />
</g>
<g id="brand" aria-label="OhMyTab brand" >
<use href="#logo" x="80" y="44" width="36" height="36"/><text x="128" y="71" font-size="22" id="brand-name" font-family="&quot;Segoe UI&quot;, sans-serif" font-weight="800" text-anchor="start" letter-spacing="-0.01em" fill="#555559">OhMyTab</text>
</g>
<g id="copy" aria-label="Localized title and description" font-family="&quot;Segoe UI&quot;, sans-serif" fill="#26262a">
<text x="80" y="301.95" font-size="46" font-weight="700" letter-spacing="-0.01em">Tidy up scattered tabs</text>
<text x="80" y="359.45" font-size="46" font-weight="700" letter-spacing="-0.01em">in one click</text><rect x="80" y="387.45" width="64" height="6" rx="3" fill="#ffb03b" /><text x="80" y="446.45" font-size="21" fill="#5d5d66">Enabled actions merge eligible tabs in the same</text>
<text x="80" y="482.15" font-size="21" fill="#5d5d66">session, close duplicates, and sort by URL or</text>
<text x="80" y="517.85" font-size="21" fill="#5d5d66">title. Pinned and protected tabs are excluded.</text>
</g>
