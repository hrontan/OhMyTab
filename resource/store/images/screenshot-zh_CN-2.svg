<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" xml:lang="zh-CN">
<defs><symbol id="logo" viewBox="0 0 128 128"><!-- Paths from resource/icon.ai PDF content; PDF coordinates reflected into SVG. -->
  <g transform="translate(0 128) scale(1 -1)">
    <path fill="#58595b" transform="translate(46.9517 121.9487)" d="M0 0 V-10.403 C3.762 -14.615 6.069 -20.155 6.069 -26.247 C6.069 -32.339 3.762 -37.879 0 -42.09 V-116.821 H28.407 V0 Z"/>
    <path fill="#58595b" transform="translate(29.2012 119.521)" d="M0 0 C-13.155 0 -23.819 -10.664 -23.819 -23.819 C-23.819 -36.974 -13.155 -47.638 0 -47.638 C7.063 -47.638 13.389 -44.546 17.75 -39.663 V-7.975 C13.389 -3.092 7.063 0 0 0 Z"/>
    <circle fill="#ffb338" cx="99.1776" cy="62.8164" r="23.8195"/>
  </g></symbol></defs>
<g id="background" aria-label="Background" >
<rect x="0" y="0" width="1280" height="800" rx="0" fill="#f7f6f3" />
</g>
<g id="brand" aria-label="OhMyTab brand" >
<use href="#logo" x="80" y="44" width="36" height="36"/><text x="128" y="71" font-size="22" id="brand-name" font-family="&quot;Segoe UI&quot;, sans-serif" font-weight="800" text-anchor="start" letter-spacing="-0.01em" fill="#555559">OhMyTab</text>
</g>
<g id="copy" aria-label="Localized title and description" font-family="&quot;Microsoft YaHei UI&quot;, &quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, sans-serif" fill="#26262a">
<text x="80" y="319.8" font-size="46" font-weight="700" letter-spacing="-0.01em">批量关闭或移动</text>
<text x="80" y="377.3" font-size="46" font-weight="700" letter-spacing="-0.01em">同一域名的选项卡</text><rect x="80" y="405.3" width="64" height="6" rx="3" fill="#ffb03b" /><text x="80" y="464.3" font-size="21" fill="#5d5d66">从右键菜单关闭或移动同一域名的合格选项卡，</text>
<text x="80" y="500" font-size="21" fill="#5d5d66">也可选择子域名级别。</text>
</g>
<g id="illustration" aria-label="Feature illustration" transform="translate(630 100)" font-family="&quot;Microsoft YaHei UI&quot;, &quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, sans-serif" fill="#26262a">
<rect x="0" y="0" width="620" height="580" rx="14" fill="#fff" stroke="#dddbd5"/><rect x="1" y="1" width="618" height="46" rx="13" fill="#ebe9e4" /><rect x="12" y="16" width="129" height="31" rx="9" fill="#f6f5f1" stroke="#dddbd5"/><rect x="23" y="25" width="12" height="12" rx="3" fill="#e8710a" /><text x="43" y="38" font-size="14" >news</text><rect x="147" y="16" width="129" height="31" rx="9" fill="#f6f5f1" stroke="#dddbd5"/><rect x="158" y="25" width="12" height="12" rx="3" fill="#e8710a" /><text x="178" y="38" font-size="14" >news</text><rect x="282" y="16" width="129" height="31" rx="9" fill="#f6f5f1" stroke="#dddbd5"/><rect x="293" y="25" width="12" height="12" rx="3" fill="#1a73e8" /><text x="313" y="38" font-size="14" >mail</text><rect x="417" y="16" width="129" height="31" rx="9" fill="#f6f5f1" stroke="#dddbd5"/><rect x="428" y="25" width="12" height="12" rx="3" fill="#188038" /><text x="448" y="38" font-size="14" >docs</text><path d="M30 133 L51 143 L37 152 Z" fill="#26262a"/><rect x="24" y="150" width="580" height="279" rx="10" fill="#fff" stroke="#cfcdc7"/><text x="40" y="185" font-size="12" >…</text><use href="#logo" x="40" y="215" width="18" height="18"/><text x="70" y="229" font-size="12" >将当前标签页提取到新窗口中</text><rect x="25" y="248" width="578" height="43" rx="0" fill="#fff1d9" /><use href="#logo" x="40" y="259" width="18" height="18"/><text x="70" y="273" font-size="12" font-weight="700">关闭同一域名中的标签页 (仅当前窗口)</text><use href="#logo" x="40" y="303" width="18" height="18"/><text x="70" y="317" font-size="12" >关闭符合域名条件的标签页 [(*.)news.example.com] (仅当前窗口)</text><use href="#logo" x="40" y="347" width="18" height="18"/><text x="70" y="361" font-size="12" >关闭符合域名条件的标签页 [(*.)example.com] (仅当前窗口)</text><use href="#logo" x="40" y="391" width="18" height="18"/><text x="70" y="405" font-size="12" >将同一域名中的标签页提取到新窗口中 (所有窗口)</text><path d="M25 202 H603" stroke="#dddbd5"/><path d="M25 334 H603" stroke="#dddbd5"/><text x="0" y="650" font-size="13" fill="#5d5d66">合格选项卡示意图，并非浏览器截图。</text>
</g>
