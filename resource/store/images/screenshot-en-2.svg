</g>
<g id="copy" aria-label="Localized title and description" font-family="&quot;Segoe UI&quot;, sans-serif" fill="#26262a">
<text x="80" y="301.95" font-size="46" font-weight="700" letter-spacing="-0.01em">Close or move tabs</text>
<text x="80" y="359.45" font-size="46" font-weight="700" letter-spacing="-0.01em">of the same domain</text><rect x="80" y="387.45" width="64" height="6" rx="3" fill="#ffb03b" /><text x="80" y="446.45" font-size="21" fill="#5d5d66">Close or move eligible tabs of the same domain</text>
<text x="80" y="482.15" font-size="21" fill="#5d5d66">from the context menu. Detailed menus can</text>
<text x="80" y="517.85" font-size="21" fill="#5d5d66">choose a subdomain level.</text>
</g>
