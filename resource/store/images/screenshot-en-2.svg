    <path fill="#58595b" transform="translate(46.9517 121.9487)" d="M0 0 V-10.403 C3.762 -14.615 6.069 -20.155 6.069 -26.247 C6.069 -32.339 3.762 -37.879 0 -42.09 V-116.821 H28.407 V0 Z"/>
